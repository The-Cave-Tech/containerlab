name: windows

topology:
  nodes:
    win1:
      kind: linux
      image: dockurr/windows:latest
      restart-policy: unless-stopped
      privileged: true
      devices:
        - /dev/kvm:/dev/kvm
        - /dev/net/tun:/dev/net/tun
      cap-add:
        - NET_ADMIN
      binds:
        - ./storage:/storage
        # Optional: use a local Windows ISO instead of downloading one.
        # - ./win.iso:/custom.iso:ro
      env:
        VERSION: "10e"
        RAM_SIZE: "8G"
        CPU_CORES: "4"
        DISK_SIZE: "40G"
        USERNAME: "clab"
        PASSWORD: "clab@123"
      ports:
        - "8006:8006"
        - "3389:3389/tcp"
        - "3389:3389/udp"
